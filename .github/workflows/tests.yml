name: Tests

run-name: ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A new push to the same branch or pull request cancels the older run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - run: poetry install

      # All quality checks: the Poe check tasks, YAML formatting, secrets and security.
      - run: poetry run pre-commit run --all-files

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Pull requests: only the oldest supported Python, to keep them fast. Elsewhere (main): all.
        python-version: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('["3.11"]')
          || fromJSON('["3.11", "3.12", "3.13", "3.14", "3.15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Tktable and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-tktable-ubuntu.sh

      - run: poetry install

      # On Linux, Tk needs a virtual display (xvfb-run).
      - name: Diagnose Tktable (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a poetry run poe check_tktable

      # Tktable is not installed on macOS and Windows runners, so this only shows the diagnosis.
      - name: Diagnose Tktable (macOS, Windows)
        if: runner.os != 'Linux'
        run: poetry run poe check_tktable || echo "Tktable is not installed on this runner, as expected."

      - name: Run tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} poetry run poe test
