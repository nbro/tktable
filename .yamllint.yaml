# yamllint configuration: https://yamllint.readthedocs.io/en/stable/configuration.html
extends: default

rules:
  # GitHub Actions workflows don't use the "---" document start.
  document-start: disable
  # GitHub Actions' "on:" key is not a boolean.
  truthy:
    check-keys: false
  # At most one blank line in a row.
  empty-lines:
    max: 1
  line-length:
    max: 120
